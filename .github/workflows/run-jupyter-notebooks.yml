name: Execute Jupyter Notebooks and Report

on:
  workflow_call:
    inputs:
      target_repo:
        description: 'The full name of the repository to checkout (e.g., username/repo_name)'
        required: true
        type: string
      timeout:
        description: 'Execution timeout in seconds for papermill'
        required: false
        type: number
        default: 420
      ubuntu_image:
        description: 'Ubuntu image to run on'
        required: false
        type: string
        default: ubuntu-latest

jobs:
  run-notebooks:
    runs-on: ${{ inputs.ubuntu_image }}
    permissions:
      contents: write  # Allows the bot to push the .md file
    steps:
      - name: Checkout Current Repo
        uses: actions/checkout@v4

      - name: Checkout External Repo
        uses: actions/checkout@v4
        with:
          # We reference the input variable here
          repository: ${{ inputs.target_repo }}
          path: 'target-repo'
          #token: ${{ secrets.PAT_TOKEN }} # Only needed if the other repo is private
          
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Colab currently runs Python 3.12
          python-version: '3.12'
          # This enables the automatic cache
          cache: 'pip'
          # This points the cache to the specific file in the checked-out repo
          cache-dependency-path: 'target-repo/requirements.txt'
          
      - name: Install Requirements
        run: |
          pip install papermill ipykernel
          if [ -f target-repo/requirements.txt ]; then pip install -r target-repo/requirements.txt; fi

      - name: Execute Notebooks and Generate Report
        run: |
          echo "## Notebook Execution Report" > report.md
          echo "| Notebook Name | Last Run | Status |" >> report.md
          echo "|---|---|---|" >> report.md
          
          cd target-repo
          for file in *.ipynb; do
            echo "Running $file..."
            # Get current timestamp
            timestamp=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            
            # Execute with Papermill
            if papermill "$file" "${file%.ipynb}_out.ipynb" --execution-timeout ${{ inputs.timeout }}; then
              status="✅ Success"
            else
              status="❌ Failed (or Timed Out)"
            fi
            
            echo "| [$file]($file) | $timestamp | $status |" >> ../report.md
          done
          
      - name: Upload Executed Notebooks and Report
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks-results
          path: |
            report.md
            target-repo/*_out.ipynb
            
      - name: Upload Report
        uses: actions/upload-artifact@v4
        with:
          name: execution-report
          path: report.md

      - name: Post Summary to Workflow
        run: cat report.md >> $GITHUB_STEP_SUMMARY

      - name: Commit Report to Current Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add report.md
          # The '|| exit 0' prevents the workflow from failing if the report hasn't changed
          git commit -m "docs: update execution report [skip ci]" || exit 0
          git push
